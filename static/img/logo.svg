<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Party Hat Warning Triangle</title>
  <desc id="desc">A yellow warning sign in the shape of a party hat with a fluffy pom pom.</desc>

  <defs>
    <filter id="fluffyFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <polygon
    points="100,30 30,190 170,190"
    fill="#FFD700"
    stroke="#DAA500"
    stroke-width="4"
  />

  <text
    x="100"
    y="165"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="100"
    fill="#DAA500"
    font-weight="bold"
  >
    !
  </text>

  <g transform="translate(100, 20)">
    <g style="filter:url(#fluffyFilter)">
      <circle cx="0" cy="0" r="18" fill="#DAA500"/>
    </g>
  </g>
</svg>
