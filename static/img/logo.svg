<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Party Hat Warning Triangle</title>
  <desc id="desc">A yellow warning sign shaped like a party hat, topped with a fluffy pom pom.</desc>

  <symbol id="logo-root" viewBox="0 0 200 200">
    <defs>
      <filter id="fluff" x="-50%" y="-50%" width="200%" height="200%">
        <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" stitchTiles="stitch" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" result="displaced" />
        <feGaussianBlur in="displaced" stdDeviation="0.3" />
      </filter>
    </defs>

    <path
      d="M100 46 L176 176 L24 176 Z"
      fill="#FFD400"
      stroke="#FFD400"
      stroke-width="16"
      stroke-linejoin="round"
    />

    <path
      d="M100 70 L152 160 L48 160 Z"
      fill="none"
      stroke="#141414"
      stroke-width="5"
      stroke-linejoin="round"
      opacity="0.85"
    />

    <rect x="92" y="92" width="16" height="38" rx="8" fill="#141414" />
    <circle cx="100" cy="146" r="9" fill="#141414" />

    <g filter="url(#fluff)">
      <circle cx="100" cy="30" r="18" fill="#FFD400" />
    </g>
  </symbol>
</svg>
