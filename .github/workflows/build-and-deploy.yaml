name: Build and deploy

on:
  workflow_call: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
      id-token: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .docusaurus
            dist
          key: "${{ runner.os }}-build-and-deploy-\
            ${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-\
            ${{ hashFiles('**.css', '**.html', '**.json', '**.mdx', '**.svg', '**.tsx', '**.yml') }}"
          restore-keys: "${{ runner.os }}-build-and-deploy-\
            ${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-"
      - name: Configure Yarn
        run: |
          yarn config set --home "npmScopes.$SCOPE.npmRegistryServer" "$REGISTRY"
          yarn config set --home "npmScopes.$SCOPE.npmAlwaysAuth" true
          yarn config set --home "npmScopes.$SCOPE.npmAuthToken" "$TOKEN"
          yarn config set --home "npmRegistries[\"$REGISTRY\"].npmAuthToken" "$TOKEN"
          yarn config set --home "npmRegistries[\"$REGISTRY\"].npmAlwaysAuth" true
        env:
          REGISTRY: https://npm.pkg.github.com
          SCOPE: throwparty
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: yarn
      - name: Build
        run: yarn build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    name: Deploy
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
